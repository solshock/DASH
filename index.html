<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solshock Ledger — Coastal Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Cinzel:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

<style>
/* ─────────────────────────────────────────────────────────────────────
   SOLSHOCK LEDGER — coastal Obsidian-style finance vault
   Palette from theme.css: navy / gold / sky / orange
   ───────────────────────────────────────────────────────────────────── */
:root {
  --navy:          #0A1628;
  --navy-mid:      #0D1F3C;
  --navy-light:    #1a2a4a;
  --navy-elev:     #16294a;
  --sky-blue:      #87CEEB;
  --electric-blue: #60B8FF;
  --gold:          #C9880A;
  --gold-light:    #F5D060;
  --orange:        #FF8C00;
  --orange-deep:   #E85D04;
  --white:         #FFFFFF;
  --foam:          #DBE9EE;
  --sand:          #C9B79C;
  --coral:         #FF6B6B;
  --teal:          #2EC4B6;
  --sage:          #8FBC8F;
  --good:          #8AE8B0;
  --bad:           #FF6B6B;

  --ink:           rgba(255,255,255,0.92);
  --ink-2:         rgba(255,255,255,0.62);
  --ink-3:         rgba(255,255,255,0.38);
  --line:          rgba(201,136,10,0.18);
  --line-2:        rgba(255,255,255,0.08);

  --gold-grad:     linear-gradient(135deg, #C9880A 0%, #F5D060 50%, #C9880A 100%);
  --signature-grad:linear-gradient(90deg, #F5D060, #60B8FF, #FF8C00, #F5D060);
  --divider-grad:  linear-gradient(90deg, #87CEEB, #0A1628, #C9880A, #F5D060, #0D1F3C, #87CEEB);

  --rad-lg: 14px;
  --rad-md: 10px;
  --rad-sm: 6px;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);

  --density-pad: 18px;
  --density-row: 44px;
  --font-size: 14px;
}

/* ── SOLSHOCK Obsidian / Command Center Theme ────────────────────────── */
/* Deep #060f1d base · #0d1d33 card surfaces · spectrum gradient          */
/* Cinzel headings · gold #F5D060 primary · full-spectrum accents         */
[data-theme="obsidian"] {
  --navy:          #0A1628;
  --navy-mid:      #0d1d33;
  --navy-light:    #112240;
  --navy-elev:     #152a50;
  --navy-deep:     #060f1d;
  --sky-blue:      #87CEEB;
  --electric-blue: #60B8FF;
  --gold:          #F5D060;
  --gold-light:    #ffe680;
  --gold-dark:     #C9880A;
  --orange:        #f76f07;
  --orange-deep:   #c85500;
  --violet:        #d00ee6;
  --purple:        #a10ee6;
  --white:         #FFFFFF;
  --foam:          #e8eaf6;
  --sand:          #C9B79C;
  --coral:         #ff5b5b;
  --teal:          #2EC4B6;
  --sage:          #8FBC8F;
  --good:          #3CCB7F;
  --bad:           #ff5b5b;
  --ink:           rgba(255, 255, 255, 0.92);
  --ink-2:         rgba(255, 255, 255, 0.62);
  --ink-3:         rgba(255, 255, 255, 0.38);
  --line:          rgba(245, 208, 96, 0.15);
  --line-2:        rgba(255, 255, 255, 0.07);
  --gold-grad:     linear-gradient(135deg, #C9880A 0%, #F5D060 50%, #ffe680 100%);
  --signature-grad:linear-gradient(90deg, #60B8FF, #87CEEB, #e6c90e, #f76f07, #d00ee6, #a10ee6);
  --divider-grad:  linear-gradient(90deg, #60B8FF, #87CEEB, #e6c90e, #f76f07, #d00ee6, #a10ee6);
  background: var(--navy);
  color: var(--ink);
}

/* Cinzel for commanding display text */
[data-theme="obsidian"] .card-title,
[data-theme="obsidian"] .page-hd h1,
[data-theme="obsidian"] .kpi-label,
[data-theme="obsidian"] .vault-title > span:last-child,
[data-theme="obsidian"] .modal-hd h3,
[data-theme="obsidian"] .tab-breadcrumb { font-family: 'Cinzel', serif; }

/* Backgrounds */
[data-theme="obsidian"] .app-bg {
  background: radial-gradient(ellipse at top, #0d2240 0%, #0A1628 35%, #060f1d 100%);
}
[data-theme="obsidian"][data-bg="midnight"] .app-bg {
  background: radial-gradient(ellipse at 50% 0%, #0d1a40, #04080f 70%);
}
[data-theme="obsidian"][data-bg="dusk"] .app-bg {
  background:
    radial-gradient(ellipse at 70% 5%, rgba(247,111,7,0.20), transparent 55%),
    radial-gradient(ellipse at 20% 100%, rgba(96,184,255,0.10), transparent 50%),
    linear-gradient(180deg, #1a1030 0%, #08080f 100%);
}

/* Chrome */
[data-theme="obsidian"] .ribbon    { background: #060f1d; border-right-color: rgba(245,208,96,0.12); }
[data-theme="obsidian"] .vault     { background: linear-gradient(180deg, #080e1c 0%, #060f1d 100%); border-right-color: rgba(245,208,96,0.12); }
[data-theme="obsidian"] .statusbar { background: #060f1d; border-top-color:  rgba(245,208,96,0.12); }
[data-theme="obsidian"] .tabbar    { border-bottom-color: rgba(245,208,96,0.12); }

/* Cards use --navy-mid (#0d1d33) */
[data-theme="obsidian"] .card { background: linear-gradient(180deg, #0d1d33 0%, rgba(6,15,29,0.92) 100%); border-color: rgba(245,208,96,0.14); }
[data-theme="obsidian"] .kpi  { background: linear-gradient(180deg, #0d1d33 0%, rgba(6,15,29,0.88) 100%); border-color: rgba(245,208,96,0.14); }
[data-theme="obsidian"] .goal-card { background: linear-gradient(180deg, #0d1d33 0%, rgba(6,15,29,0.88) 100%); border-color: rgba(245,208,96,0.14); }

/* Overlays */
[data-theme="obsidian"] .cmd-scrim    { background: rgba(4,8,15,0.72); }
[data-theme="obsidian"] .cmd-pal      { background: linear-gradient(180deg, #0d1d33 0%, #060f1d 100%); border-color: rgba(245,208,96,0.22); }
[data-theme="obsidian"] .modal-scrim  { background: rgba(4,8,15,0.76); }
[data-theme="obsidian"] .modal        { background: linear-gradient(180deg, #0d1d33 0%, #060f1d 100%); border-color: rgba(245,208,96,0.22); }

/* Active / hover states — spectrum gold */
[data-theme="obsidian"] .tab.on        { background: #0d1d33; color: var(--gold); }
[data-theme="obsidian"] .tab.on::after { background: var(--gold-grad); }
[data-theme="obsidian"] .tab-new:hover { color: var(--gold); }
[data-theme="obsidian"] .ribbon-btn:hover { color: var(--gold); }
[data-theme="obsidian"] .ribbon-btn.on {
  background: rgba(245,208,96,0.12);
  color: var(--gold);
  box-shadow: inset 0 0 0 1px rgba(245,208,96,0.28);
}
[data-theme="obsidian"] .file-row.active {
  background: rgba(245,208,96,0.07);
  color: var(--gold);
  border-left-color: var(--gold-dark);
}
[data-theme="obsidian"] .cmd-row.on,
[data-theme="obsidian"] .cmd-row:hover { background: rgba(245,208,96,0.08); color: var(--gold); }
[data-theme="obsidian"] .status-pill   { background: rgba(245,208,96,0.12); color: var(--gold); }
[data-theme="obsidian"] .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
[data-theme="obsidian"] .btn-link       { color: var(--electric-blue); }
[data-theme="obsidian"] .btn-link:hover { color: var(--gold); }
[data-theme="obsidian"] .field input:focus,
[data-theme="obsidian"] .field select:focus { border-color: rgba(245,208,96,0.45); }

/* Good/bad override */
[data-theme="obsidian"] .statusbar .good { color: #3CCB7F; }
[data-theme="obsidian"] .statusbar .bad  { color: #ff5b5b; }

[data-density="compact"]  { --density-pad: 10px; --density-row: 34px; --font-size: 13px; }
[data-density="regular"]  { --density-pad: 14px; --density-row: 40px; --font-size: 14px; }
[data-density="spacious"] { --density-pad: 20px; --density-row: 50px; --font-size: 15px; }

*, *::before, *::after { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  font-family: 'Raleway', system-ui, -apple-system, sans-serif;
  background: var(--navy);
  color: var(--ink);
  font-size: var(--font-size);
  overflow: hidden;
}

/* Background — subtle coastal radial */
.app-bg {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse at 80% -10%, rgba(201,136,10,0.10), transparent 50%),
    radial-gradient(ellipse at -10% 90%, rgba(96,184,255,0.07), transparent 50%),
    linear-gradient(180deg, #0A1628 0%, #0c1c36 100%);
}
[data-bg="midnight"] .app-bg {
  background: radial-gradient(ellipse at 50% 0%, #0e2147, #050d1b 70%);
}
[data-bg="dusk"] .app-bg {
  background:
    radial-gradient(ellipse at 75% 10%, rgba(255,140,0,0.18), transparent 55%),
    radial-gradient(ellipse at 20% 110%, rgba(96,184,255,0.10), transparent 50%),
    linear-gradient(180deg, #1a1330 0%, #0d1428 100%);
}

/* Typography helpers */
.font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }
.tnum { font-variant-numeric: tabular-nums; }
.upper { text-transform: uppercase; letter-spacing: 0.18em; }
.gold-text {
  background: var(--gold-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.signature-text {
  background: var(--signature-grad);
  background-size: 300% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: sigShift 8s linear infinite;
}
@keyframes sigShift { 0% { background-position: 0% 0%; } 100% { background-position: 300% 0%; } }

.divider-anim {
  height: 2px; width: 100%;
  background: var(--divider-grad);
  background-size: 300% 100%;
  animation: dividerMove 6s linear infinite;
}
@keyframes dividerMove { 0% { background-position: 0% 0%; } 100% { background-position: 300% 0%; } }

/* ── Layout grid ────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 48px var(--vault-w, 260px) 1fr;
  grid-template-rows: 40px 1fr 28px;
  grid-template-areas:
    "ribbon tabs    tabs"
    "ribbon vault   main"
    "ribbon status  status";
  height: 100vh;
}
.app[data-sidebar="closed"] { grid-template-columns: 48px 0 1fr; }
.app[data-sidebar="closed"] .vault { display: none; }

/* ── Ribbon ─────────────────────────────────────────────────────────── */
.ribbon {
  grid-area: ribbon;
  background: #050e1c;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0; gap: 4px;
  grid-row: 1 / 4;
}
.ribbon-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 0; background: transparent;
  color: rgba(255,255,255,0.55);
  display: grid; place-items: center; cursor: pointer;
  transition: background .15s, color .15s;
}
.ribbon-btn:hover { background: rgba(255,255,255,0.06); color: var(--gold-light); }
.ribbon-btn.on   { background: rgba(201,136,10,0.18); color: var(--gold-light); box-shadow: inset 0 0 0 1px rgba(201,136,10,0.35); }
.ribbon-sep { width: 24px; height: 1px; background: var(--line); margin: 6px 0; }
.ribbon-decor { padding: 6px; opacity: .9; }

/* ── Tab bar ────────────────────────────────────────────────────────── */
.tabbar {
  grid-area: tabs;
  background: var(--navy);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: stretch;
  padding: 0 8px; gap: 2px;
}
.tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; min-width: 120px; max-width: 220px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 12px;
  border-right: 1px solid var(--line-2);
  position: relative;
  transition: background .15s, color .15s;
}
.tab:hover { background: rgba(255,255,255,0.03); color: var(--ink); }
.tab.on { background: var(--navy-mid); color: var(--gold-light); }
.tab.on::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--gold-grad);
}
.tab-icon { font-size: 13px; }
.tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab-x {
  margin-left: auto; border: 0; background: transparent; color: var(--ink-3);
  width: 18px; height: 18px; border-radius: 4px; cursor: pointer; line-height: 1;
}
.tab-x:hover { background: rgba(255,255,255,0.1); color: var(--ink); }
.tab-new {
  border: 0; background: transparent; color: var(--ink-3);
  padding: 0 10px; cursor: pointer; font-size: 14px;
}
.tab-new:hover { color: var(--gold-light); }
.tab-breadcrumb {
  align-self: center; padding-right: 12px;
  font-size: 11px; color: var(--ink-3);
  font-family: 'JetBrains Mono', monospace;
}
.tab-breadcrumb span { padding: 0 4px; color: rgba(255,255,255,0.2); }

/* ── Vault sidebar ──────────────────────────────────────────────────── */
.vault {
  grid-area: vault;
  background: linear-gradient(180deg, #081428 0%, #0a1830 100%);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.vault-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--line-2);
}
.vault-title { display: flex; align-items: center; gap: 8px; }
.vault-pin {
  font-size: 14px; color: var(--gold-light);
}
.vault-title > span:last-child {
  font-size: 11px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
  background: var(--gold-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.vault-actions { display: flex; gap: 2px; }
.vault-actions button {
  width: 22px; height: 22px; border: 0; background: transparent; color: var(--ink-3);
  cursor: pointer; border-radius: 4px; font-size: 13px;
}
.vault-actions button:hover { color: var(--gold-light); background: rgba(255,255,255,0.05); }

.vault-search {
  margin: 10px; display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line-2);
  border-radius: var(--rad-sm);
}
.vault-search input {
  flex: 1; background: transparent; border: 0; color: var(--ink);
  font-family: inherit; font-size: 12px; outline: none;
}
.vault-search input::placeholder { color: var(--ink-3); }
.vault-search kbd {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 3px;
  color: var(--ink-3);
}

.tree { flex: 1; overflow-y: auto; padding: 4px 6px 12px; }
.tree::-webkit-scrollbar { width: 8px; }
.tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

.folder { }
.folder-row {
  width: 100%; border: 0; background: transparent;
  display: flex; align-items: center; gap: 4px;
  padding: 4px 6px; cursor: pointer;
  color: var(--ink-2); font-family: inherit; font-size: 12px;
  text-align: left; border-radius: 4px;
}
.folder-row:hover { background: rgba(255,255,255,0.04); color: var(--ink); }
.chev { display: inline-block; width: 10px; font-size: 9px; color: var(--ink-3); transition: transform .15s; }
.folder-icon { font-size: 11px; }
.folder-label { flex: 1; font-weight: 600; letter-spacing: 0.04em; }
.folder-badge {
  font-size: 9px; padding: 1px 6px; border-radius: 999px;
  background: var(--gold-grad); color: var(--navy); font-weight: 800;
}
.folder-count {
  font-size: 10px; color: var(--ink-3); font-family: 'JetBrains Mono', monospace;
}
.folder-body { padding-left: 14px; }

.file-row {
  width: 100%; border: 0; background: transparent;
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px 4px 14px; cursor: pointer;
  color: var(--ink-2); font-family: inherit; font-size: 12px;
  text-align: left; border-radius: 4px;
  border-left: 2px solid transparent;
}
.file-row:hover { background: rgba(255,255,255,0.04); color: var(--ink); }
.file-row.active {
  background: rgba(96,184,255,0.10);
  color: var(--gold-light);
  border-left-color: var(--gold);
}
.file-row.muted { color: var(--ink-3); }
.file-icon { font-size: 10px; opacity: 0.8; }

.vault-foot {
  border-top: 1px solid var(--line-2);
  padding: 10px 14px;
  font-size: 11px;
}
.coastal-decor { width: 100%; height: 60px; margin-bottom: 6px; }
.vault-foot-row {
  display: flex; justify-content: space-between; align-items: baseline;
  color: var(--ink-3);
  text-transform: uppercase; letter-spacing: 0.15em; font-size: 9px;
}
.vault-foot-row strong {
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  background: var(--gold-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: 0;
}

/* ── Main content ───────────────────────────────────────────────────── */
.main {
  grid-area: main;
  overflow-y: auto;
  position: relative;
}
.main::-webkit-scrollbar { width: 12px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 6px; border: 3px solid var(--navy); }
.pane {
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px clamp(20px, 4vw, 56px) 64px;
}

/* ── Status bar ─────────────────────────────────────────────────────── */
.statusbar {
  grid-area: status;
  background: #050e1c;
  border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  font-size: 11px;
  color: var(--ink-3);
  font-family: 'JetBrains Mono', monospace;
}
.statusbar .dot { color: rgba(255,255,255,0.15); }
.statusbar .good { color: var(--good); }
.statusbar .bad { color: var(--bad); }
.status-pill {
  background: rgba(201,136,10,0.12); color: var(--gold-light);
  padding: 2px 8px; border-radius: 999px; font-size: 10px;
  letter-spacing: 0.08em;
}

/* ── Command palette ────────────────────────────────────────────────── */
.cmd-scrim {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(5,14,28,0.6);
  backdrop-filter: blur(4px);
  display: flex; justify-content: center; align-items: flex-start;
  padding-top: 14vh;
  animation: scrimIn .15s var(--ease);
}
@keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
.cmd-pal {
  width: min(640px, 92vw);
  background: linear-gradient(180deg, #0d1f3c 0%, #0a1628 100%);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
  overflow: hidden;
  animation: palIn .18s var(--ease);
}
@keyframes palIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.cmd-input {
  width: 100%; border: 0; background: transparent;
  color: var(--ink); font-family: inherit; font-size: 16px;
  padding: 18px 22px; outline: none;
  border-bottom: 1px solid var(--line);
}
.cmd-input::placeholder { color: var(--ink-3); }
.cmd-list { max-height: 380px; overflow-y: auto; padding: 6px; }
.cmd-row {
  width: 100%; border: 0; background: transparent;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--rad-sm);
  color: var(--ink); font-family: inherit; font-size: 13px; cursor: pointer;
  text-align: left;
}
.cmd-row.on, .cmd-row:hover {
  background: rgba(96,184,255,0.10);
  color: var(--gold-light);
}
.cmd-icon { width: 24px; text-align: center; opacity: 0.85; }
.cmd-label { flex: 1; }
.cmd-kind {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
  color: var(--ink-3); padding: 2px 8px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
}
.cmd-empty { padding: 24px; text-align: center; color: var(--ink-3); }
.cmd-foot {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  font-size: 11px; color: var(--ink-3); font-family: 'JetBrains Mono', monospace;
}
.cmd-foot kbd {
  background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px;
  color: var(--foam); margin-right: 4px;
}

/* ── Cards / Surfaces ───────────────────────────────────────────────── */
.card {
  background: linear-gradient(180deg, rgba(26,42,74,0.6) 0%, rgba(13,31,60,0.6) 100%);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: var(--density-pad);
  position: relative;
  overflow: hidden;
}
.card.tight { padding: 14px; }
.card-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-size: 10px; font-weight: 800; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold-light);
}
.card-sub { font-size: 11px; color: var(--ink-3); }

/* Page header */
.page-hd {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}
.page-hd .crumb {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--ink-3); margin-bottom: 8px;
  letter-spacing: 0.06em;
}
.page-hd h1 {
  margin: 0;
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--gold-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1.08;
  white-space: nowrap;
}
.page-hd .lede {
  font-size: 13px; color: var(--ink-2); margin-top: 8px; max-width: 56ch;
  font-weight: 400;
}
.page-hd-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit; font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 10px 18px; border-radius: var(--rad-sm);
  border: 1px solid transparent; cursor: pointer;
  transition: all .2s var(--ease);
  white-space: nowrap;
}
.btn-gold {
  background: var(--gold); color: var(--navy);
  border-color: var(--gold);
}
.btn-gold:hover { background: var(--gold-light); box-shadow: 0 0 24px rgba(245,208,96,0.35); }
.btn-ghost {
  background: transparent; color: var(--ink);
  border-color: rgba(255,255,255,0.2);
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold-light); }
.btn-sm { padding: 6px 12px; font-size: 10px; letter-spacing: 0.14em; }
.btn-link {
  background: transparent; border: 0; color: var(--electric-blue);
  font-family: inherit; font-size: 11px; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700;
  padding: 4px 0;
}
.btn-link:hover { color: var(--gold-light); }
.icon-btn {
  width: 28px; height: 28px; border: 0; background: transparent;
  color: var(--ink-3); border-radius: 6px; cursor: pointer; font-size: 14px;
  display: grid; place-items: center;
}
.icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--gold-light); }

/* KPI tiles */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
@media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
.kpi {
  background: linear-gradient(180deg, rgba(26,42,74,0.7) 0%, rgba(13,31,60,0.5) 100%);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.kpi-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 10px;
}
.kpi-val {
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  font-size: 28px; line-height: 1.1; letter-spacing: -0.01em;
  color: var(--white);
}
.kpi.gold .kpi-val {
  background: var(--gold-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.kpi-meta {
  margin-top: 8px; font-size: 11px; color: var(--ink-3);
  display: flex; align-items: center; gap: 6px;
}
.kpi-meta .up { color: var(--good); }
.kpi-meta .down { color: var(--coral); }
.kpi-deco {
  position: absolute; top: 12px; right: 14px;
  font-size: 18px; opacity: 0.35; pointer-events: none;
  filter: saturate(0.6);
}

/* Grids */
.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
@media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

/* ── Donut chart ────────────────────────────────────────────────────── */
.donut-wrap {
  display: grid;
  grid-template-columns: minmax(220px, 320px) 1fr;
  gap: 28px;
  align-items: center;
}
@media (max-width: 900px) { .donut-wrap { grid-template-columns: 1fr; } }
.donut-svg { width: 100%; height: auto; max-width: 320px; }
.donut-svg .seg {
  transition: stroke-dashoffset 1.2s var(--ease), stroke-width .2s, opacity .2s;
  cursor: pointer;
}
.donut-svg .seg:hover { stroke-width: 34; }
.donut-svg .seg.dim { opacity: 0.25; }
.donut-center {
  text-anchor: middle; dominant-baseline: middle;
}
.donut-center .big {
  font-family: 'JetBrains Mono', monospace; font-size: 22px;
  fill: var(--gold-light); font-weight: 600;
}
.donut-center .lbl {
  font-size: 8px; fill: var(--ink-3); letter-spacing: 0.18em;
  text-transform: uppercase; font-weight: 700;
}

.donut-legend { display: flex; flex-direction: column; gap: 6px; }
.legend-row {
  display: grid;
  grid-template-columns: 14px 1fr auto auto;
  gap: 12px; align-items: center;
  padding: 6px 8px; border-radius: 6px;
  cursor: pointer; transition: background .15s;
  font-size: 12px;
}
.legend-row:hover { background: rgba(255,255,255,0.04); }
.legend-row.dim { opacity: 0.45; }
.legend-sw { width: 12px; height: 12px; border-radius: 3px; }
.legend-name { color: var(--ink); }
.legend-pct { font-family: 'JetBrains Mono', monospace; color: var(--ink-2); font-size: 11px; min-width: 44px; text-align: right; }
.legend-amt { font-family: 'JetBrains Mono', monospace; color: var(--foam); min-width: 80px; text-align: right; }

/* ── Envelope rows ──────────────────────────────────────────────────── */
.env-row {
  display: grid;
  grid-template-columns: 38px 1fr 110px 220px 110px 80px;
  gap: 14px;
  align-items: center;
  padding: 12px;
  border-radius: var(--rad-md);
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--line-2);
  margin-bottom: 8px;
  transition: border-color .15s, background .15s;
}
.env-row:hover { background: rgba(255,255,255,0.04); border-color: var(--line); }
.env-icon {
  width: 34px; height: 34px; border-radius: 8px;
  display: grid; place-items: center; font-size: 16px;
  background: rgba(201,136,10,0.10);
  border: 1px solid var(--line);
}
.env-name { font-weight: 600; }
.env-name .sub { font-size: 11px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }
.env-vals { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.env-vals .small { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.bar-wrap {
  position: relative; height: 8px; border-radius: 999px;
  background: rgba(255,255,255,0.06); overflow: hidden;
}
.bar-fill {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: var(--gold-grad);
  border-radius: 999px;
  transition: width 1s var(--ease);
}
.bar-fill.over { background: linear-gradient(90deg, var(--coral), var(--orange)); }
.bar-fill.flush { background: linear-gradient(90deg, var(--teal), var(--sky-blue)); }
.bar-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--ink-3); font-family: 'JetBrains Mono', monospace; }
.pct-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(96,184,255,0.12); color: var(--electric-blue);
  text-align: center;
}
.pct-pill.warn { background: rgba(255,140,0,0.15); color: var(--orange); }
.pct-pill.over { background: rgba(255,107,107,0.15); color: var(--coral); }

/* ── Bills ──────────────────────────────────────────────────────────── */
.bill-row {
  display: grid;
  grid-template-columns: 40px 1fr 100px 140px 80px 80px;
  gap: 14px;
  align-items: center;
  padding: 12px;
  border-radius: var(--rad-md);
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--line-2);
  margin-bottom: 8px;
  transition: all .15s;
}
.bill-row.inactive { opacity: 0.45; }
.bill-row:hover { background: rgba(255,255,255,0.04); border-color: var(--line); }
.bill-logo {
  width: 36px; height: 36px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 16px;
  background: linear-gradient(135deg, rgba(96,184,255,0.12), rgba(135,206,235,0.05));
  border: 1px solid var(--line-2);
}
.bill-amount { font-family: 'JetBrains Mono', monospace; text-align: right; font-weight: 600; }
.bill-next {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--ink-2);
}
.bill-next .days {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  background: rgba(135,206,235,0.10); color: var(--sky-blue);
  font-size: 10px; margin-left: 6px;
}
.bill-next .days.soon { background: rgba(255,140,0,0.15); color: var(--orange); }
.bill-next .days.urgent { background: rgba(255,107,107,0.15); color: var(--coral); }
.bill-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-3);
}
.toggle {
  position: relative; width: 34px; height: 18px;
  background: rgba(255,255,255,0.12);
  border-radius: 999px; border: 0; cursor: pointer;
  padding: 0; transition: background .2s;
}
.toggle[data-on="1"] { background: var(--gold); }
.toggle i {
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--white); transition: transform .2s;
}
.toggle[data-on="1"] i { transform: translateX(16px); }

/* ── Goals ──────────────────────────────────────────────────────────── */
.goal-card {
  background: linear-gradient(180deg, rgba(26,42,74,0.7) 0%, rgba(13,31,60,0.5) 100%);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 18px;
  position: relative;
  overflow: hidden;
  display: flex; flex-direction: column; gap: 14px;
}
.goal-card::after {
  content: ''; position: absolute; inset: -1px;
  background: var(--gold-grad);
  opacity: 0; transition: opacity .25s; pointer-events: none;
  border-radius: var(--rad-lg);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  -webkit-mask-composite: xor;
  padding: 1px;
}
.goal-card:hover::after { opacity: 0.4; }
.goal-hd { display: flex; align-items: center; gap: 12px; }
.goal-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center; font-size: 22px;
  background: linear-gradient(135deg, rgba(201,136,10,0.18), rgba(96,184,255,0.08));
  border: 1px solid var(--line);
}
.goal-name { font-weight: 700; font-size: 15px; }
.goal-meta { font-size: 11px; color: var(--ink-3); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
.goal-vals { display: flex; align-items: baseline; justify-content: space-between; }
.goal-vals .saved {
  font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;
  background: var(--gold-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.goal-vals .target {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-3);
}
.goal-pct {
  position: absolute; top: 14px; right: 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 3px 10px; border-radius: 999px;
  background: rgba(135,206,235,0.10); color: var(--sky-blue);
}
.goal-actions { display: flex; gap: 8px; margin-top: 4px; }
.goal-actions .btn { flex: 1; justify-content: center; }
.goal-bar-wrap {
  position: relative; height: 10px; border-radius: 999px;
  background: rgba(255,255,255,0.06); overflow: hidden;
}
.goal-bar-fill {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: var(--gold-grad);
  border-radius: 999px;
  transition: width 1.4s var(--ease);
}

/* ── Debt ───────────────────────────────────────────────────────────── */
.debt-row {
  display: grid;
  grid-template-columns: 42px 1.4fr 1fr 1fr 1fr 90px;
  gap: 16px;
  align-items: center;
  padding: 14px;
  border-radius: var(--rad-md);
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--line-2);
  margin-bottom: 10px;
}
.debt-row:hover { background: rgba(255,255,255,0.04); border-color: var(--line); }
.debt-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center; font-size: 18px;
  background: linear-gradient(135deg, rgba(255,140,0,0.12), rgba(201,136,10,0.08));
  border: 1px solid var(--line);
}
.debt-balance {
  font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 17px;
  color: var(--coral);
}
.debt-progress-wrap {
  position: relative; height: 6px; border-radius: 999px;
  background: rgba(255,255,255,0.06); overflow: hidden;
  margin-top: 6px;
}
.debt-progress-fill {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: linear-gradient(90deg, var(--teal), var(--sky-blue));
  border-radius: 999px;
}
.debt-meta-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--ink-3); margin-bottom: 3px; font-weight: 700; }
.debt-meta-val   { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--foam); }
.apr-pill {
  display: inline-block; padding: 3px 8px; border-radius: 999px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
}
.apr-pill.high { background: rgba(255,107,107,0.15); color: var(--coral); }
.apr-pill.med  { background: rgba(255,140,0,0.12); color: var(--orange); }
.apr-pill.low  { background: rgba(135,206,235,0.10); color: var(--sky-blue); }

/* ── Transactions table ─────────────────────────────────────────────── */
.txn-table { width: 100%; border-collapse: collapse; }
.txn-table thead th {
  text-align: left; padding: 10px 12px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-3);
  border-bottom: 1px solid var(--line);
}
.txn-table tbody td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line-2);
  font-size: 13px;
}
.txn-table tbody tr:hover { background: rgba(255,255,255,0.03); }
.txn-date { font-family: 'JetBrains Mono', monospace; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.txn-payee { font-weight: 600; }
.txn-note { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.txn-amount { font-family: 'JetBrains Mono', monospace; text-align: right; font-weight: 600; white-space: nowrap; }
.txn-amount.in { color: var(--good); }
.txn-amount.out { color: var(--foam); }
.txn-env-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(255,255,255,0.05);
  font-size: 11px;
}
.txn-env-pill.income { background: rgba(138,232,176,0.10); color: var(--good); }

/* ── Modal ──────────────────────────────────────────────────────────── */
.modal-scrim {
  position: fixed; inset: 0; z-index: 900;
  background: rgba(5,14,28,0.65);
  backdrop-filter: blur(6px);
  display: grid; place-items: center;
  animation: scrimIn .15s var(--ease);
}
.modal {
  width: min(520px, 92vw);
  background: linear-gradient(180deg, #0d1f3c 0%, #0a1628 100%);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  overflow: hidden;
  animation: palIn .18s var(--ease);
}
.modal-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
}
.modal-hd h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-light); }
.modal-body { padding: 18px 22px; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; background: rgba(0,0,0,0.2); }

/* Form fields */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); }
.field input, .field select, .field textarea {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line-2);
  border-radius: var(--rad-sm);
  color: var(--ink);
  font-family: inherit; font-size: 13px;
  padding: 10px 12px; outline: none;
  transition: border-color .15s, background .15s;
}
.field input:focus, .field select:focus { border-color: var(--gold); background: rgba(255,255,255,0.06); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Empty state */
.empty {
  padding: 40px 20px; text-align: center; color: var(--ink-3);
  border: 1px dashed var(--line); border-radius: var(--rad-md);
}
.empty .em-icon { font-size: 28px; margin-bottom: 8px; }

/* Misc */
.row { display: flex; align-items: center; gap: 10px; }
.right { margin-left: auto; }
.spacer { flex: 1; }
.muted { color: var(--ink-3); }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em;
  background: rgba(255,255,255,0.05); color: var(--ink-2);
}
.tag.gold { background: rgba(201,136,10,0.18); color: var(--gold-light); }
.tag.blue { background: rgba(96,184,255,0.12); color: var(--electric-blue); }
.tag.coral { background: rgba(255,107,107,0.15); color: var(--coral); }

/* ── Tweaks panel position override (so it sits above status bar) ──── */
.twk-panel { bottom: 40px !important; }

/* Loading shimmer */
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
</style>
</head>
